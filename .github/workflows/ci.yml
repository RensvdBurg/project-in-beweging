# CI-pipeline voor UpMove.
# Draait op elke pull request naar main/develop/test/release en op pushes naar die branches.
# Elke job hieronder is een aparte "status check" die je in de branch-protection
# als verplicht kunt instellen.
name: CI

on:
  pull_request:
    branches: [main, develop, test, release]
  push:
    branches: [main, develop, test, release]
  workflow_dispatch:

# Oude runs van dezelfde PR annuleren zodra er een nieuwe commit binnenkomt.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  # ── Codestijl ────────────────────────────────────────────────────────────────
  pint:
    name: Codestijl (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Composer-cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer-dependencies installeren
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Pint controleren (geen wijzigingen toegestaan)
        run: vendor/bin/pint --test -v

  # ── Statische analyse ────────────────────────────────────────────────────────
  phpstan:
    name: Statische analyse (PHPStan/Larastan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Composer-cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer valideren
        run: composer validate --strict --no-check-publish

      - name: Composer-dependencies installeren
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan uitvoeren
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  # ── Tests + frontend-build ───────────────────────────────────────────────────
  tests:
    name: Tests (PHPUnit) + Vite-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Composer-cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer-dependencies installeren
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: NPM-dependencies installeren
        run: npm ci

      - name: Frontend bouwen (Vite)
        run: npm run build

      - name: Omgeving voorbereiden
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite

      - name: Migraties vanaf nul uitvoeren (SQLite)
        run: php artisan migrate:fresh --force --ansi

      - name: PHPUnit-tests uitvoeren
        run: php artisan test

  # ── Beveiliging ──────────────────────────────────────────────────────────────
  security:
    name: Security (audits + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # volledige historie, zodat gitleaks alle commits kan scannen

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Composer audit (bekende kwetsbaarheden in PHP-pakketten)
        run: composer audit --locked --no-interaction

      - name: NPM audit (bekende kwetsbaarheden in JS-pakketten)
        run: npm audit --audit-level=high

      - name: Gelekte secrets zoeken (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Controleert of een PR nieuwe dependencies met bekende kwetsbaarheden of een
  # problematische licentie toevoegt.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
