# CodeQL: statische security-analyse van de JavaScript-code en de workflows zelf.
# (CodeQL ondersteunt geen PHP; PHP wordt gedekt door PHPStan en composer audit in ci.yml.)
name: CodeQL

on:
  pull_request:
    branches: [main, develop, test, release]
  push:
    branches: [main, develop, test, release]
  schedule:
    - cron: '30 5 * * 1' # elke maandag, voor nieuw ontdekte kwetsbaarheden

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
